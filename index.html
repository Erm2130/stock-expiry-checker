const $ = (s, r=document) => r.querySelector(s);
function el(tag, props={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)){
    if (k==='class') e.className = v;
    else if (k==='text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v===true) e.setAttribute(k,'');
    else if (v!==false && v!=null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()){ if(c) e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}

const iso = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
function parse(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?{y:+m[1],m:+m[2],d:+m[3]}:null; }
const dim = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
function validDate(s){ const p=parse(s); return !!p && p.y>=1990 && p.y<=2100; }
function addMonths(s,k){ const p=parse(s); if(!p) return ''; const t=p.y*12+(p.m-1)+k; const y=Math.floor(t/12), m=t%12+1; return iso(y,m,Math.min(p.d,dim(y,m))); }
const dayNum = s => { const p=parse(s); return p?Date.UTC(p.y,p.m-1,p.d)/864e5:NaN; };
const fmt = s => { const p=parse(s); return p?`${pad(p.d)}/${pad(p.m)}/${p.y}`:''; };
const uid = () => 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const LS = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };

const state = {
  catalog: [], rows: [], date: iso(new Date().getFullYear(), new Date().getMonth()+1, new Date().getDate()), tab: 'check',
  group: 'ALL', q: '', catQ: '', showHidden: false, savedId: null, history: []
};
const pmap = () => new Map(state.catalog.map(p=>[p.id,p]));
const newRow = pid => ({uid: uid(), pid, mfg:'', exp:'', src:'', hidden:false});

function loadLocal(){
  const c = LS.get('cat_v2'); state.catalog = (c && c.length) ? c : INITIAL_CATALOG.map(p=>({...p}));
  const d = LS.get('draft_v2');
  if (d && d.rows && d.rows.length){ state.rows = d.rows.filter(r=>pmap().has(r.pid)); state.date = d.date; state.savedId = d.savedId; }
  else { state.rows = state.catalog.map(p=>newRow(p.id)); }
  state.history = LS.get('hist_v2') || [];
}
function saveAll(){ LS.set('cat_v2', state.catalog); LS.set('draft_v2', {date:state.date, rows:state.rows, savedId:state.savedId}); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; setTimeout(()=>t.hidden=true, 3000); }

/* Logic */
function calc(row){
  const p = pmap().get(row.pid);
  if (p.noExp) return {st:'na', d:'ไม่มีวันหมดอายุ (ไม่ต้องระบุ)', s:'ปกติ'};
  if (!validDate(row.exp)) return {st:'none', d:'กรอกวันผลิต/หมดอายุ', s:''};
  const days = dayNum(row.exp) - dayNum(state.date);
  if (days < 0) return {st:'bad', d:`หมดอายุแล้ว ${Math.abs(days)} วัน`, s:'หมดอายุ'};
  if (days === 0) return {st:'bad', d:'หมดอายุวันนี้', s:'หมดอายุ'};
  if (days <= 60) return {st:'warn', d:`เหลือ ${days} วัน`, s:'ใกล้หมดอายุ'};
  return {st:'ok', d:`เหลือ ${days} วัน`, s:'ปกติ'};
}
const complete = row => {
  const p = pmap().get(row.pid);
  return p.noExp ? validDate(row.mfg) : validDate(row.exp);
};

/* Rendering Rows */
function buildRow(row, prod){
  const id = row.uid;
  const noExp = prod.noExp;
  const node = el('article', {class:'row ' + (noExp ? 'no-exp-row' : ''), id:'r-'+id, 'data-uid':id},
    el('div',{class:'who'},
      el('div',{class:'meta'}, el('span',{class:'tag '+prod.g, text:prod.g}), el('span',{text:prod.code})),
      el('h3',{class:'nm', text:prod.name}),
      !noExp ? el('label',{class:'life', for:'m-'+id}, 'อายุ', el('input',{id:'m-'+id, type:'number', min:1, value:prod.months||'', onchange:e=>updateCatMonths(prod.id, e.target.value)}), 'เดือน') : null
    ),
    el('label',{class:'fld mfg', for:'f-'+id}, 'วันผลิต', el('input',{id:'f-'+id, type:'date', value:row.mfg, oninput:e=>onDate(row,'mfg',e.target.value)})),
    !noExp ? el('label',{class:'fld exp', for:'e-'+id}, 'วันหมดอายุ', el('input',{id:'e-'+id, type:'date', value:row.exp, oninput:e=>onDate(row,'exp',e.target.value)})) : null,
    el('div',{class:'res'}, el('span',{class:'days'}), el('span',{class:'sub'})),
    el('div',{class:'acts'},
      el('button',{class:'btn sm', type:'button', text:'+ ล็อตเพิ่ม', onclick:()=>{
        state.rows.splice(state.rows.indexOf(row)+1, 0, newRow(row.pid)); saveAll(); renderList();
      }}),
      el('button',{class:'btn sm danger', type:'button', text:'ลบ', onclick:()=>{ state.rows=state.rows.filter(r=>r!==row); saveAll(); renderList(); }})
    )
  );
  paintRow(node, row, prod);
  return node;
}
function paintRow(node, row, prod){
  const c = calc(row); node.className = `row st-${c.st} ` + (prod.noExp ? 'no-exp-row' : '');
  $('.days', node).textContent = c.d; $('.sub', node).textContent = c.s;
}

let timers = new Map();
function touch(row){
  state.savedId = null; saveAll();
  const n = $('#r-'+row.uid); if(n) paintRow(n, row, pmap().get(row.pid));
  renderSummary(); renderBar();
  
  clearTimeout(timers.get(row.uid));
  if (complete(row) && $('#autoHideCb').checked){
    timers.set(row.uid, setTimeout(()=>{
      row.hidden = true; saveAll(); renderList(); renderSummary(); renderBar();
    }, 1500));
  }
}
function onDate(row, field, val){
  row[field] = val; row.src = field;
  const p = pmap().get(row.pid);
  if (!p.noExp && p.months && validDate(val)){
    if (field==='mfg') row.exp = addMonths(val, p.months);
    else row.mfg = addMonths(val, -p.months);
    const n = $('#r-'+row.uid); 
    if(n){ const o = field==='mfg'?'#e-':'#f-'; $(o+row.uid, n).value = row[field==='mfg'?'exp':'mfg']; }
  }
  touch(row);
}
function updateCatMonths(pid, val){
  const p = state.catalog.find(x=>x.id===pid); if(!p) return;
  p.months = parseInt(val,10)||null; p.noExp = !p.months; saveAll();
  state.rows.forEach(r=>{ if(r.pid===pid && r.src==='mfg' && validDate(r.mfg) && p.months) r.exp = addMonths(r.mfg, p.months); });
  renderList(); renderCatalog();
}

function renderList(){
  const pm = pmap(), list = $('#list'); list.replaceChildren();
  const vis = state.rows.filter(r=>!r.hidden && (state.group==='ALL' || pm.get(r.pid)?.g===state.group) && (!state.q || (pm.get(r.pid)?.name+pm.get(r.pid)?.code).toLowerCase().includes(state.q.toLowerCase())));
  
  let last = null;
  vis.forEach(r=>{
    const p = pm.get(r.pid);
    if (p.g!==last){ last = p.g; list.append(el('h2',{class:'grp'}, GROUPS[p.g])); }
    list.append(buildRow(r,p));
  });

  const hid = state.rows.filter(r=>r.hidden);
  $('#hiddenWrap').replaceChildren();
  if (hid.length){
    $('#hiddenWrap').append(el('button',{class:'btn', style:'margin-top:10px', text:`แสดงรายการที่ซ่อนไว้ (${hid.length})`, onclick:()=>{
      state.showHidden = !state.showHidden; renderList();
    }}));
    if (state.showHidden){
      const hb = el('div',{id:'hiddenList'});
      hid.forEach(r=>{
        const p = pm.get(r.pid), c = calc(r);
        hb.append(el('div',{class:'crow st-'+c.st}, 
          el('h3',{class:'nm'}, p.name, ' ', el('span',{class:'tag '+p.g, text:p.g})),
          el('button',{class:'btn sm', text:'แก้ไข', onclick:()=>{ r.hidden=false; saveAll(); renderList(); }}),
          el('div',{class:'line2'}, p.noExp ? `ผลิต ${fmt(r.mfg)}` : `หมดอายุ ${fmt(r.exp)} · `, el('span',{class:'stt', text:c.d}))
        ));
      });
      $('#hiddenWrap').append(hb);
    }
  }
}

function renderSummary(){
  const pm = pmap();
  $('#chips').replaceChildren(['ALL',...ORDER].map(g=>{
    const cnt = state.rows.filter(r=>!r.hidden && (g==='ALL'||pm.get(r.pid)?.g===g)).length;
    return el('button',{class:'chip', 'aria-pressed':String(state.group===g), text:`${g==='ALL'?'ทั้งหมด':g} (${cnt})`, onclick:()=>{state.group=g;renderList();}});
  }));
}
function renderBar(){
  const done = state.rows.filter(complete).length, total = state.rows.length;
  $('#progLbl').textContent = state.savedId ? 'บันทึกแล้ว' : `เสร็จ ${done}/${total}`;
  $('#meter').style.width = (total ? done/total*100 : 0)+'%';
  $('#saveBtn').disabled = total===0 || done<total || state.savedId;
}

/* Catalog Drag & Drop & Add */
let dragItem = null;
function renderCatalog(){
  const box = $('#catList'); box.replaceChildren();
  ORDER.forEach(g=>{
    const items = state.catalog.filter(p=>p.g===g && (!state.catQ || (p.name+p.code).toLowerCase().includes(state.catQ.toLowerCase())));
    if(!items.length) return;
    const card = el('div',{class:'card'}, el('div',{class:'cgrp', text:GROUPS[g]}));
    items.forEach((p, idx)=>{
      const row = el('div',{class:'crowc', draggable:true, 'data-id':p.id});
      row.ondragstart = e=>{ dragItem = p; e.dataTransfer.effectAllowed='move'; };
      row.ondragover = e=>{ e.preventDefault(); row.classList.add('drag-over'); };
      row.ondragleave = ()=>row.classList.remove('drag-over');
      row.ondrop = e=>{
        e.preventDefault(); row.classList.remove('drag-over');
        if (dragItem && dragItem !== p){
          const from = state.catalog.indexOf(dragItem), to = state.catalog.indexOf(p);
          state.catalog.splice(from, 1);
          state.catalog.splice(to, 0, dragItem);
          saveAll(); renderCatalog(); renderProdList();
        }
      };
      row.append(
        el('div',{class:'drag-handle'}, '☰'),
        el('div',{class:'cn'}, el('b',{text:p.name}), el('span',{text:p.code||'-'})),
        el('input',{class:'cmonths', type:'number', value:p.months||'', placeholder:'-', onchange:e=>updateCatMonths(p.id, e.target.value)}),
        el('button',{class:'btn sm danger', text:'ลบ', onclick:()=>{ state.catalog=state.catalog.filter(x=>x.id!==p.id); saveAll(); renderCatalog(); }})
      );
      card.append(row);
    });
    box.append(card);
  });
}
$('#cNewBtn').onclick = ()=>{
  const g = $('#cNewGroup').value, code = $('#cNewCode').value.trim(), name = $('#cNewName').value.trim();
  const m = parseInt($('#cNewMonths').value, 10);
  if(!name){ toast('กรุณาระบุชื่อสินค้า'); return; }
  const p = {id:uid(), g, code, name, months:m>0?m:null, noExp:!(m>0)};
  state.catalog.push(p); saveAll();
  $('#cNewCode').value = ''; $('#cNewName').value = ''; $('#cNewMonths').value = '';
  toast('เพิ่มรายการสินค้าใหม่แล้ว'); renderCatalog(); renderProdList();
};

/* Init & Tabs */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  state.tab = b.dataset.tab;
  ['check','history','catalog'].forEach(k=>$('#view-'+k).hidden = k!==state.tab);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', String(t===b)));
  $('#bar').hidden = state.tab!=='check';
  if(state.tab==='catalog') renderCatalog();
});

function renderProdList(){
  $('#prodList').replaceChildren(...state.catalog.map(p=>el('option',{value:`${p.code||''} ${p.name}`.trim()})));
}
$('#addBtn').onclick = ()=>{
  const txt = $('#addPick').value.trim().toLowerCase();
  const p = state.catalog.find(x=>`${x.code} ${x.name}`.toLowerCase().includes(txt));
  if(p){ state.rows.push(newRow(p.id)); $('#addPick').value=''; saveAll(); renderList(); toast('เพิ่มแล้ว'); }
};

$('#checkDate').onchange = e=>{ state.date=e.target.value; saveAll(); renderList(); renderBar(); };
$('#search').oninput = e=>{ state.q=e.target.value; renderList(); };
$('#catSearch').oninput = e=>{ state.catQ=e.target.value; renderCatalog(); };
$('#resetBtn').onclick = ()=>{ if(confirm('ล้างที่กรอกทั้งหมด?')){ state.rows = state.catalog.map(p=>newRow(p.id)); state.savedId=null; saveAll(); renderList(); renderSummary(); renderBar(); } };

loadLocal(); renderProdList(); renderList(); renderSummary(); renderBar();
</script>
</body></html>
